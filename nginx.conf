server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (best-effort; Traefik may also add HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Health endpoint — spec contract 4: GET /health → 200 {"status":"ok"}
    location = /health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # Also allow /health/ with trailing slash
    location = /health/ {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # Static site fallback — serve files, fallback to index.html for SPA-like routing
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Docs are copied as static files; allow directory listing off
    location /docs/ {
        try_files $uri $uri/ =404;
    }

    # Gzip for text
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}

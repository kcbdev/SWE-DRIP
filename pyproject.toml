[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-drip"
version = "0.1.0"
description = "SWE Drip V1 — FastAPI Control Panel API + LangGraph pipeline (single deployable)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "sse-starlette>=2.1",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.setuptools]
packages = ["api", "api.app", "api.app.routers", "pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests", "pipeline/tests"]

[tool.ruff]
line-length = 100

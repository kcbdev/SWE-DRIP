<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" role="img">
  <title>SWE Drip — Light wordmark</title>
  <desc>SWE Drip brand logo light version: terminal prompt in dark green followed by SWE DRIP in void black, on warm light background</desc>
  <rect width="400" height="100" fill="#F0EFEA" rx="10"/>
  <text
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="30"
    y="62"
  >
    <tspan fill="#006B1A" opacity="0.85" x="28">&gt;_ </tspan><tspan fill="#0D0D0D" letter-spacing="3">SWE DRIP</tspan>
  </text>
</svg>
